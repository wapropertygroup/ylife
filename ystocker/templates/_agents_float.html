<div id="agentsFloatingRoot" class="agents-floating-root">
  <button id="agentsFloatingLauncher" class="agents-floating-launcher"
          type="button" aria-controls="agentsFloatingPanel" aria-expanded="false">
    <span class="agents-floating-mark" aria-hidden="true">
      <svg viewBox="0 0 28 28" fill="none">
        <path d="M5 19.5 10.2 14l4.1 3.2L22.5 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="5" cy="19.5" r="1.7" fill="currentColor"/>
        <circle cx="10.2" cy="14" r="1.7" fill="currentColor"/>
        <circle cx="14.3" cy="17.2" r="1.7" fill="currentColor"/>
        <circle cx="22.5" cy="8" r="1.7" fill="currentColor"/>
      </svg>
    </span>
    <span class="agents-floating-launcher-copy">
      <span data-i18n="agents.float_status">AI research desk</span>
      <strong data-i18n="agents.float_open">Trading Agents</strong>
    </span>
    <span class="agents-floating-live" aria-hidden="true"></span>
  </button>

  <section id="agentsFloatingPanel" class="agents-floating-panel" role="dialog"
           aria-modal="false" aria-labelledby="agentsFloatingTitle" hidden>
    <header id="agentsFloatingHandle" class="agents-floating-bar">
      <span class="agents-floating-grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="agents-floating-signal" aria-hidden="true"><i></i></span>
      <span class="agents-floating-heading">
        <span data-i18n="agents.float_status">AI research desk</span>
        <strong id="agentsFloatingTitle" data-i18n="agents.float_open">Trading Agents</strong>
      </span>
      <span class="agents-floating-actions">
        <button id="agentsFloatingMaximize" type="button" aria-label="Open full page"
                data-i18n-title="agents.float_expand" title="Open full page">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M11 4h5v5m0-5-6.5 6.5M8.5 4H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3.5"/>
          </svg>
        </button>
        <button id="agentsFloatingMinimize" type="button" aria-label="Minimize"
                data-i18n-title="agents.float_minimize" title="Minimize">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5h10"/></svg>
        </button>
        <button id="agentsFloatingClose" type="button" aria-label="Close"
                data-i18n-title="agents.float_close" title="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8"/></svg>
        </button>
      </span>
    </header>
    <div class="agents-floating-body">
      <div id="agentsFloatingLoading" class="agents-floating-loading">
        <span aria-hidden="true"></span>
        <p data-i18n="agents.float_loading">Opening research desk…</p>
      </div>
      <iframe id="agentsFloatingFrame" title="Trading Agents"
              data-src="{{ url_for('main.agents_page', embed=1) }}"></iframe>
    </div>
    <div id="agentsFloatingResizer" class="agents-floating-resizer" aria-hidden="true"></div>
  </section>
</div>
