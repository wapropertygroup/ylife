{% extends "base.html" %}
{% block title %}QR Code Generator — yImage{% endblock %}
{% block content %}
<div x-data="qrTool()">
  <div class="max-w-2xl mx-auto">
    <a href="/" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-brand transition mb-4">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      <span data-i18n="common.all_tools">All Tools</span>
    </a>
    <h1 class="text-2xl font-extrabold mb-2" data-i18n="qr.title">📱 QR Code Generator</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6" data-i18n="qr.desc">Turn any text or URL into a scannable QR code. Customize size, colors, and error correction.</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Left: Input & Options -->
      <div class="space-y-4">
        <!-- Text Input -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-sm font-medium" data-i18n="qr.content">Content</label>
            <span class="text-xs text-slate-400" x-text="text.length + '/4000'"></span>
          </div>
          <textarea x-model="text" maxlength="4000" rows="4"
                    placeholder="https://example.com, plain text, Wi-Fi config…"
                    class="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:border-brand focus:outline-none resize-none"></textarea>
        </div>

        <!-- Size -->
        <div>
          <label class="text-sm font-medium mb-2 block" data-i18n="qr.size">Size</label>
          <div class="flex gap-2">
            <template x-for="s in sizes" :key="s.val">
              <button @click="size=s.val"
                      :class="size===s.val ? 'bg-brand text-white' : 'bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300'"
                      class="flex-1 py-2 rounded-lg text-sm font-medium transition"
                      x-text="s.label"></button>
            </template>
          </div>
        </div>

        <!-- Error Correction -->
        <div>
          <label class="text-sm font-medium mb-2 block" data-i18n="qr.error_correction">Error Correction</label>
          <div class="flex gap-2">
            <template x-for="ec in ecLevels" :key="ec.val">
              <button @click="errorCorrection=ec.val"
                      :class="errorCorrection===ec.val ? 'bg-brand text-white' : 'bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300'"
                      class="flex-1 py-1.5 rounded-lg text-xs font-medium transition"
                      x-text="ec.label"></button>
            </template>
          </div>
          <p class="text-xs text-slate-400 mt-1" x-text="ecHint"></p>
        </div>

        <!-- Colors -->
        <div class="flex gap-4">
          <div class="flex-1">
            <label class="text-sm font-medium mb-1 block" data-i18n="qr.fg_color">Foreground</label>
            <div class="flex items-center gap-2">
              <input type="color" x-model="fgColor"
                     class="w-9 h-9 rounded cursor-pointer border border-slate-300 dark:border-slate-700 p-0.5 bg-white">
              <input type="text" x-model="fgColor" maxlength="7"
                     class="flex-1 px-2 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-mono focus:border-brand focus:outline-none">
            </div>
          </div>
          <div class="flex-1">
            <label class="text-sm font-medium mb-1 block" data-i18n="qr.bg_color">Background</label>
            <div class="flex items-center gap-2">
              <input type="color" x-model="bgColor"
                     class="w-9 h-9 rounded cursor-pointer border border-slate-300 dark:border-slate-700 p-0.5 bg-white">
              <input type="text" x-model="bgColor" maxlength="7"
                     class="flex-1 px-2 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-mono focus:border-brand focus:outline-none">
            </div>
          </div>
        </div>

        <!-- Generate Button -->
        <button @click="generate()" :disabled="processing || !text.trim()"
                class="w-full py-3 rounded-xl bg-brand text-white font-semibold hover:bg-brand-dark transition disabled:opacity-50">
          <span x-show="!processing" data-i18n="qr.generate">Generate QR Code</span>
          <span x-show="processing" class="flex items-center justify-center gap-2">
            <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            <span data-i18n="common.processing">Processing...</span>
          </span>
        </button>
      </div>

      <!-- Right: Preview -->
      <div class="flex flex-col items-center justify-center">
        <div x-show="!previewUrl && !error"
             class="w-48 h-48 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center text-slate-400">
          <svg class="w-16 h-16 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
          </svg>
        </div>

        <div x-show="previewUrl" class="text-center space-y-3">
          <div class="rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700 inline-block p-2 bg-white">
            <img :src="previewUrl" class="w-48 h-48 object-contain block" alt="QR Code">
          </div>
          <a :href="previewUrl" download="qrcode.png"
             class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl border border-brand text-brand font-semibold text-sm hover:bg-brand hover:text-white transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span data-i18n="qr.download">Download PNG</span>
          </a>
        </div>
      </div>
    </div>

    <p x-show="error" class="mt-4 text-sm text-red-500" x-text="error"></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function qrTool() {
  return {
    text: '',
    size: 'medium',
    errorCorrection: 'M',
    fgColor: '#000000',
    bgColor: '#ffffff',
    previewUrl: '',
    processing: false, error: '',

    sizes: [
      {val:'small',  label:'Small'},
      {val:'medium', label:'Medium'},
      {val:'large',  label:'Large'},
    ],
    ecLevels: [
      {val:'L', label:'L (7%)'},
      {val:'M', label:'M (15%)'},
      {val:'Q', label:'Q (25%)'},
      {val:'H', label:'H (30%)'},
    ],

    get ecHint() {
      const hints = {
        L:'Low — smallest QR, fast scan',
        M:'Medium — recommended for most uses',
        Q:'High — survives minor damage',
        H:'Highest — up to 30% can be obscured',
      };
      return hints[this.errorCorrection] || '';
    },

    async generate() {
      if (!this.text.trim() || this.processing) return;
      this.processing = true; this.error = '';
      if (this.previewUrl) URL.revokeObjectURL(this.previewUrl);
      this.previewUrl = '';
      const form = new FormData();
      form.append('text',             this.text);
      form.append('size',             this.size);
      form.append('error_correction', this.errorCorrection);
      form.append('fg_color',         this.fgColor);
      form.append('bg_color',         this.bgColor);
      try {
        const resp = await fetch('/api/qr-code', { method: 'POST', body: form });
        if (!resp.ok) { const d = await resp.json(); this.error = d.error || 'Failed'; this.processing = false; return; }
        const blob = await resp.blob();
        this.previewUrl = URL.createObjectURL(blob);
      } catch(e) { this.error = 'Network error: ' + e.message; }
      this.processing = false;
    },
  };
}
</script>
{% endblock %}
